[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nsmpa"
version = "0.8.0"
description = "Evidence engine for how U.S. newsrooms handle requests to unpublish, de-index or anonymize old reporting."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kaleb Hoffer"}]
keywords = ["journalism", "ethics", "unpublishing", "de-indexing", "right to be forgotten", "research"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Sociology",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx[http2]>=0.27",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "tenacity>=9.0",
  "lxml>=5.0",
  "pypdf>=5.0",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
ai = ["google-genai>=2.0"]
claude = ["anthropic>=1.0"]
playwright = ["playwright>=1.48"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.urls]
Repository = "https://github.com/kalebhoffer/nsmpa"
Evidence = "https://github.com/kalebhoffer/nsmpa/tree/main/evidence"
Issues = "https://github.com/kalebhoffer/nsmpa/issues"

[project.scripts]
nsmpa = "nsmpa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nsmpa"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
# Real-problem rules: pyflakes, bugbear, async misuse, silent excepts, imports, modern syntax, simplifications.
select = ["E", "F", "W", "B", "ASYNC", "S110", "S112", "PLW1510", "DTZ005", "I", "UP", "SIM", "C4", "RUF"]
ignore = [
  "E501",    # long prose/SQL strings are kept readable rather than wrapped
  "B008",    # typer.Option(...) defaults are the typer idiom
  "RUF001", "RUF002", "RUF003",  # curly quotes and dashes in journalism text are intentional
  "SIM108",  # ternaries are not always clearer
  "RUF012",  # class-level constants on handler classes
  "C408",    # dict(key=...) reads well for record-like literals
  "RUF005",  # list concatenation is clear where used
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S110", "S112", "ASYNC230", "ASYNC240", "SIM115"]  # tests may read fixtures synchronously
