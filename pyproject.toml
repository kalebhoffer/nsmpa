[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nsmpa"
version = "0.3.0"
description = "NSMPA: a resumable national journalism post-publication policy, precedent, and guidance research engine."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "NSMPA"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx[http2]>=0.27",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "tenacity>=9.0",
  "lxml>=5.0",
  "pypdf>=5.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
playwright = ["playwright>=1.48"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
nsmpa = "nsmpa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nsmpa"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
